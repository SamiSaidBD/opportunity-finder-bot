name: Run Bot

on:
  schedule:
    - cron: "7 2,5,8,11,14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run bot
        run: python3 bot.py
        env:
          LLM_PROVIDER: groq
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}

      - name: Save record
        if: always()
        run: |
          mkdir -p data
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "update records" && git push)
